<script>
const DATA={"meta": {"curso": "Química 2.º Bachillerato", "unidad": 3, "titulo": "Enlace químico", "clave": "u3", "repo": "Q2-Tarjetas-Enlace-quimico", "url": "https://ivanpb26.github.io/Q2-Tarjetas-Enlace-quimico/", "modo2": {"tab": "Moléculas", "titulo": "Molécula sorpresa", "chip": "★ Tipo PAU", "tarea": "Hazlo tú primero: <b>Lewis → zonas → geometría → hibridación → polaridad</b>. Después destapa cada paso.", "ayuda": "moléculas como las de la PAU. Haz tú los 5 pasos (Lewis, zonas, geometría, hibridación y polaridad) y destápalos uno a uno.", "print_hint": "Lewis → zonas → geometría → hibridación → polaridad"}}, "blocks": ["Por qué se forman los enlaces", "Enlace iónico", "Enlace covalente y estructuras de Lewis", "Enlaces σ y π (TEV)", "Geometría: RPECV e hibridación", "Polaridad de las moléculas", "Enlace metálico y fuerzas intermoleculares"], "cards": [{"id": "c0_0", "b": 0, "q": "¿Por qué se forma un enlace químico?", "a": "Porque los átomos unidos tienen <b>menos energía</b> que separados: son <b>más estables</b>. Al enlazarse tienden a alcanzar la configuración de gas noble.", "img": "curva", "ex": 1, "e": 1}, {"id": "c0_1", "b": 0, "q": "¿Cuáles son los tres tipos de enlace y cómo consigue cada uno la configuración de gas noble?", "a": "<b>Iónico</b>: transferencia de electrones (metal + no metal).<br><b>Covalente</b>: compartición de pares de electrones (no metales).<br><b>Metálico</b>: los electrones de valencia se liberan y forman un «gas de electrones» (metales).", "img": "tipos", "ex": 1, "e": 1}, {"id": "c0_2", "b": 0, "q": "¿Cómo se predice el tipo de enlace con la diferencia de electronegatividad (Δχ)?", "a": "Δχ = 0 → covalente <b>apolar</b>.<br>Δχ intermedia → covalente <b>polar</b>.<br>Δχ &gt; 1,7 → <b>iónico</b> (regla orientativa: el BeF₂ y el BF₃ la superan y son covalentes).", "img": "delta_chi", "ex": 1, "e": 1}, {"id": "c0_3", "b": 0, "q": "En la curva energía–distancia del H₂, ¿qué representan el mínimo, r₀ y la profundidad del pozo?", "a": "El <b>mínimo</b> es la situación más estable: ahí se forma el enlace.<br><b>r₀ = 74 pm</b> es la longitud de enlace.<br>La <b>profundidad</b>, 436 kJ·mol⁻¹, es la energía de enlace.<br>Si se acercan más, predominan las repulsiones entre los núcleos.", "img": "curva", "ex": 0, "e": 0}, {"id": "c0_4", "b": 0, "q": "Te dan dos elementos por su número atómico Z. ¿Qué pasos sigues para decir qué enlace forman y su fórmula?", "a": "1. Configuración electrónica.<br>2. ¿Metal o no metal?<br>3. Tipo de enlace (metal + no metal → iónico; no metales → covalente).<br>4. Iones: valencia iónica.<br>5. Fórmula neutra: K⁺ + S²⁻ → <b>K₂S</b>; Sr²⁺ + Br⁻ → <b>SrBr₂</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c0_5", "b": 0, "q": "¿Qué es la valencia iónica? Indica la del Li, Ca, Cl y O.", "a": "Es la carga del ion que alcanza la configuración de gas noble.<br>Li → <b>Li⁺</b> (+1) · Ca → <b>Ca²⁺</b> (+2) · Cl → <b>Cl⁻</b> (−1) · O → <b>O²⁻</b> (−2).", "img": null, "ex": 1, "e": 1}, {"id": "c0_6", "b": 0, "q": "¿Qué es la covalencia? ¿Por qué el Cl puede presentar covalencias 1, 3, 5 y 7?", "a": "Covalencia = número de electrones desapareados = número de enlaces covalentes que forma.<br>El Cl (3s² 3p⁵) tiene 1 electrón desapareado, pero puede <b>promocionar</b> electrones a los orbitales 3d vacíos y tener 3, 5 o 7 desapareados.", "img": null, "ex": 0, "e": 0}, {"id": "c1_0", "b": 1, "q": "¿Qué es la energía reticular (Er)?", "a": "La energía que se <b>desprende</b> al formarse 1 mol de cristal iónico a partir de sus iones en estado gaseoso:<br>Na⁺(g) + Cl⁻(g) → NaCl(s) ; <b>Er &lt; 0</b>.<br>Mide la estabilidad del cristal.", "img": null, "ex": 1, "e": 1}, {"id": "c1_1", "b": 1, "q": "¿De qué depende la energía reticular?", "a": "Es mayor (más negativa) cuanto <b>mayor es la carga</b> de los iones y <b>menor su tamaño</b>.<br>De los dos factores, la carga suele pesar más.", "img": null, "ex": 1, "e": 1}, {"id": "c1_2", "b": 1, "q": "¿Por qué el MgO tiene un punto de fusión mucho mayor que el NaCl?", "a": "Sus iones tienen <b>carga doble</b> (Mg²⁺ y O²⁻) y son pequeños → energía reticular mucho mayor → hace falta más energía para romper la red.", "img": null, "ex": 1, "e": 1}, {"id": "c1_3", "b": 1, "q": "Escribe la ley de Hess del ciclo de Born-Haber para un compuesto MX.", "a": "<b>ΔHf = S + ½D + I + Eaf + Er</b><br>S: sublimación del metal · ½D: disociación de medio mol de X₂ · I: ionización · Eaf: afinidad electrónica · Er: energía reticular.", "img": "bh_nacl", "ex": 1, "e": 1}, {"id": "c1_4", "b": 1, "q": "En el ciclo de Born-Haber, ¿qué etapas son endotérmicas y cuáles exotérmicas?", "a": "<b>Suben (endotérmicas)</b>: sublimación S, ½ disociación ½D, ionización I.<br><b>Bajan (exotérmicas)</b>: afinidad electrónica Eaf y energía reticular Er.", "img": null, "ex": 1, "e": 1}, {"id": "c1_5", "b": 1, "q": "¿Cuáles son los errores más frecuentes en el ciclo de Born-Haber?", "a": "• Olvidar el <b>½</b> de D.<br>• Cambiar el signo de Eaf o de Er.<br>• En iones de carga 2 sumar solo I₁: hay que sumar <b>I₁ + I₂</b>.<br>• En el CaCl₂ (2 Cl) entra D completa y 2·Eaf.", "img": null, "ex": 1, "e": 0}, {"id": "c1_6", "b": 1, "q": "Ecuación de Born-Landé: ¿qué cuidado hay que tener con las unidades?", "a": "Er = −K·A·N<sub>A</sub>·|Z⁺|·|Z⁻|·e²/r₀ · (1 − 1/n)<br><b>r₀ en metros</b> (1 pm = 10⁻¹² m). El resultado sale en J/mol: divide entre 1000 para pasarlo a kJ/mol.", "img": null, "ex": 1, "e": 0}, {"id": "c1_7", "b": 1, "q": "Índice de coordinación del NaCl, del CsCl y del ZnS.", "a": "NaCl: <b>6:6</b> · CsCl: <b>8:8</b> · ZnS: <b>4:4</b><br>(número de iones de signo contrario que rodean a cada ion).", "img": "redes", "ex": 0, "e": 0}, {"id": "c1_8", "b": 1, "q": "¿Por qué los compuestos iónicos son duros pero frágiles?", "a": "Duros: la atracción entre iones es fuerte.<br>Frágiles: un golpe <b>desplaza una capa</b> y enfrenta iones del mismo signo, que se repelen y rompen el cristal.", "img": "fragilidad", "ex": 1, "e": 1}, {"id": "c1_9", "b": 1, "q": "¿Cuándo conduce la electricidad un compuesto iónico?", "a": "Solo <b>fundido o disuelto</b>, porque los iones quedan libres y pueden moverse.<br>En estado sólido <b>no conduce</b>: los iones están fijos en la red.", "img": "conductividad", "ex": 1, "e": 1}, {"id": "c1_10", "b": 1, "q": "¿Por qué el NaCl se disuelve en agua?", "a": "El agua es polar: el extremo δ− (O) rodea a los Na⁺ y el extremo δ+ (H) rodea a los Cl⁻. Los iones quedan <b>rodeados de agua (hidratados)</b> y se separan de la red.", "img": "disolucion", "ex": 1, "e": 0}, {"id": "c1_11", "b": 1, "q": "Propiedades típicas de los compuestos iónicos (di al menos tres).", "a": "Sólidos cristalinos a temperatura ambiente · <b>punto de fusión alto</b> · duros pero frágiles · solubles en agua · conducen <b>solo fundidos o disueltos</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c2_0", "b": 2, "q": "¿Cuáles son los cinco pasos para dibujar una estructura de Lewis?", "a": "1. Electrones de valencia.<br>2. Ajuste por carga (anión: se suman; catión: se restan).<br>3. Átomo central (el de mayor covalencia; <b>nunca el H</b>).<br>4. Regla del octeto.<br>5. Enlaces múltiples si faltan electrones.", "img": null, "ex": 1, "e": 1}, {"id": "c2_1", "b": 2, "q": "Método C = N − D: ¿qué significa cada letra?", "a": "<b>N</b>: electrones necesarios (8 por átomo; H 2; Be 4; B 6).<br><b>D</b>: electrones disponibles (de valencia, ± carga).<br><b>C = N − D</b>: compartidos → C/2 = número de enlaces.<br><b>S = D − C</b>: solitarios → S/2 = pares no enlazantes.", "img": null, "ex": 1, "e": 1}, {"id": "c2_2", "b": 2, "q": "Aplica el método N–D–C–S al H₂O.", "a": "N = 2·2 + 8 = 12 · D = 2·1 + 6 = 8<br>C = 12 − 8 = 4 → <b>2 enlaces O–H</b><br>S = 8 − 4 = 4 → <b>2 pares solitarios</b> en el O.", "img": null, "ex": 1, "e": 1}, {"id": "c2_3", "b": 2, "q": "¿Qué es un enlace covalente coordinado (dativo)? Pon un ejemplo.", "a": "Un átomo (<b>dador</b>) aporta el par de electrones completo y otro (<b>aceptor</b>) aporta un orbital vacío.<br>Ejemplo: NH₃ + H⁺ → <b>NH₄⁺</b> (también H₃O⁺). Una vez formado es igual que los demás enlaces.", "img": "dativo", "ex": 1, "e": 1}, {"id": "c2_4", "b": 2, "q": "¿Qué es la hipovalencia? Pon dos ejemplos.", "a": "El átomo central se queda con <b>menos de 8 e⁻</b> y la molécula es estable.<br>BeCl₂: el Be tiene 4 e⁻. BF₃: el B tiene 6 e⁻.", "img": null, "ex": 1, "e": 1}, {"id": "c2_5", "b": 2, "q": "¿Qué es la hipervalencia? ¿Sirve el método N–D–C–S?", "a": "El átomo central tiene <b>más de 8 e⁻</b>: P con 10 e⁻ en el PCl₅, S con 12 e⁻ en el SF₆.<br>N–D–C–S <b>no sirve</b>: se reparten los D electrones (2 por enlace, 6 en cada átomo exterior y el resto al central).", "img": null, "ex": 0, "e": 0}, {"id": "c2_6", "b": 2, "q": "¿Cómo se calcula la carga formal (CF) de un átomo?", "a": "<b>CF = e⁻ de valencia − (e⁻ no enlazantes + ½ e⁻ enlazantes)</b><br>La suma de las CF es igual a la carga de la especie (0 en una molécula).<br>Ejemplo NH₄⁺: N = 5 − (0 + ½·8) = <b>+1</b>.", "img": null, "ex": 1, "e": 0}, {"id": "c2_7", "b": 2, "q": "¿Qué es la resonancia? Pon ejemplos.", "a": "Cuando una especie tiene <b>varias estructuras de Lewis</b> equivalentes. La real es una mezcla (híbrido) de todas: los enlaces son iguales y de orden intermedio.<br>Ejemplos: O₃, CO₃²⁻, NO₃⁻ (orden 4/3).", "img": "resonancia", "ex": 1, "e": 0}, {"id": "c2_8", "b": 2, "q": "¿Qué relación hay entre orden, longitud y energía de enlace?", "a": "A <b>mayor orden</b> de enlace (simple → doble → triple), <b>menor longitud</b> y <b>mayor energía</b> de enlace.<br>C–C 154 pm · C=C 133 pm · C≡C 120 pm.", "img": null, "ex": 1, "e": 1}, {"id": "c2_9", "b": 2, "q": "¿Es polar el enlace del H₂? ¿Y el del HBr?", "a": "H₂: <b>apolar</b>, los dos átomos son iguales.<br>HBr: <b>polar</b>, el Br es más electronegativo y se queda con la carga parcial δ−; el H, con δ+.", "img": null, "ex": 1, "e": 1}, {"id": "c2_10", "b": 2, "q": "Sustancias covalentes atómicas frente a moleculares: ejemplos y propiedades.", "a": "<b>Atómicas</b> (diamante, grafito, SiO₂): red de enlaces covalentes → muy duras, punto de fusión muy alto, insolubles, no conducen (salvo el grafito).<br><b>Moleculares</b> (H₂O, CO₂, I₂): punto de fusión bajo, blandas, no conducen.", "img": null, "ex": 1, "e": 1}, {"id": "c3_0", "b": 3, "q": "¿Qué diferencia hay entre un enlace σ y un enlace π?", "a": "<b>σ</b>: solapamiento <b>frontal</b> de orbitales → fuerte.<br><b>π</b>: solapamiento <b>lateral</b> de orbitales p → más débil y más fácil de romper.", "img": null, "ex": 1, "e": 1}, {"id": "c3_1", "b": 3, "q": "¿Cuántos enlaces σ y π tiene un enlace simple, uno doble y uno triple?", "a": "Simple: <b>1σ</b><br>Doble: <b>1σ + 1π</b><br>Triple: <b>1σ + 2π</b>", "img": null, "ex": 1, "e": 1}, {"id": "c3_2", "b": 3, "q": "¿Cuántos enlaces σ y π hay en el eteno (C₂H₄) y en el etino (C₂H₂)?", "a": "Eteno: <b>5σ + 1π</b> (4 C–H + 1 C–C σ, y el π del doble enlace).<br>Etino: <b>3σ + 2π</b> (2 C–H + 1 C–C σ, y los 2 π del triple enlace).", "img": null, "ex": 1, "e": 0}, {"id": "c3_3", "b": 3, "q": "¿Por qué los alquenos y alquinos dan reacciones de adición?", "a": "Porque el enlace <b>π es débil</b> y se rompe con facilidad para que se unan nuevos átomos.", "img": null, "ex": 0, "e": 0}, {"id": "c3_4", "b": 3, "q": "¿Por qué con orbitales p puros no se explica el ángulo del agua?", "a": "Con orbitales p puros saldrían ángulos de <b>90°</b>, pero el real es 104,5°. Para explicarlo se necesita la RPECV (y la hibridación).", "img": null, "ex": 0, "e": 0}, {"id": "c4_0", "b": 4, "q": "¿En qué se basa la teoría RPECV?", "a": "Las zonas de densidad electrónica que rodean al átomo central (enlaces y pares solitarios) se colocan <b>lo más separadas posible</b> para repelerse lo mínimo.", "img": null, "ex": 1, "e": 1}, {"id": "c4_1", "b": 4, "q": "¿Qué cuenta como una «zona» en la RPECV?", "a": "Cada <b>enlace</b> (simple, doble o triple: <b>todos cuentan como 1 zona</b>) y cada <b>par solitario</b> del átomo central.", "img": null, "ex": 1, "e": 1}, {"id": "c4_2", "b": 4, "q": "2 zonas sin pares solitarios: geometría, ángulo y ejemplos.", "a": "<b>Lineal, 180°</b> (AB₂)<br>BeCl₂, CO₂, HCN", "img": null, "ex": 1, "e": 1}, {"id": "c4_3", "b": 4, "q": "3 zonas sin pares solitarios: geometría, ángulo y ejemplos.", "a": "<b>Trigonal plana, 120°</b> (AB₃)<br>BF₃, AlCl₃, CO₃²⁻", "img": null, "ex": 1, "e": 1}, {"id": "c4_4", "b": 4, "q": "4 zonas sin pares solitarios: geometría, ángulo y ejemplos.", "a": "<b>Tetraédrica, 109,5°</b> (AB₄)<br>CH₄, CCl₄, SiCl₄, NH₄⁺", "img": null, "ex": 1, "e": 1}, {"id": "c4_5", "b": 4, "q": "4 zonas con 1 par solitario: geometría, ángulo y ejemplos.", "a": "Disposición de los pares tetraédrica → geometría de <b>pirámide trigonal, ≈ 107°</b> (AB₃E)<br>NH₃, PH₃, NF₃, PCl₃", "img": "nh3_geo", "ex": 1, "e": 1}, {"id": "c4_6", "b": 4, "q": "4 zonas con 2 pares solitarios: geometría, ángulo y ejemplos.", "a": "Disposición de los pares tetraédrica → geometría <b>angular, ≈ 104,5°</b> (AB₂E₂)<br>H₂O, H₂S, OF₂", "img": null, "ex": 1, "e": 1}, {"id": "c4_7", "b": 4, "q": "¿Por qué los pares solitarios cierran los ángulos de enlace?", "a": "Porque <b>repelen más</b> que los pares de enlace y empujan a los enlaces a juntarse (NH₃ 107°, H₂O 104,5°, por debajo de 109,5°).", "img": null, "ex": 1, "e": 1}, {"id": "c4_8", "b": 4, "q": "¿Qué diferencia hay entre «disposición de los pares» y «geometría molecular»?", "a": "<b>Disposición de los pares</b>: cómo se colocan todas las zonas (enlaces + pares solitarios).<br><b>Geometría molecular</b>: solo la posición de los átomos (los pares no se «ven»).<br>NH₃: disposición tetraédrica, geometría de pirámide trigonal.", "img": null, "ex": 1, "e": 1}, {"id": "c4_9", "b": 4, "q": "¿Qué hibridación tiene el átomo central según su número de zonas?", "a": "2 zonas → <b>sp</b> · 3 zonas → <b>sp²</b> · 4 zonas → <b>sp³</b><br>(5 → sp³d · 6 → sp³d²)", "img": null, "ex": 1, "e": 1}, {"id": "c4_10", "b": 4, "q": "Explica la hibridación del C en el CH₄.", "a": "Estado fundamental 2s² 2p² (2 e⁻ desapareados) → <b>promoción</b> 2s¹ 2p³ (4 desapareados) → se mezclan 1 s + 3 p → <b>4 orbitales sp³</b> a 109,5° → 4 enlaces σ C–H.", "img": "sp3", "ex": 1, "e": 0}, {"id": "c4_11", "b": 4, "q": "¿Qué hibridación tiene cada C en el etano, el eteno y el etino?", "a": "Etano: <b>sp³</b> · Eteno: <b>sp²</b> · Etino: <b>sp</b>.<br>Los orbitales p que quedan sin hibridar forman los enlaces π.", "img": null, "ex": 1, "e": 0}, {"id": "c4_12", "b": 4, "q": "5 y 6 zonas sin pares solitarios: geometría y ejemplos.", "a": "5 zonas: <b>bipirámide trigonal</b> (PCl₅).<br>6 zonas: <b>octaédrica</b> (SF₆).", "img": null, "ex": 0, "e": 0}, {"id": "c4_13", "b": 4, "q": "Atajo PAU: ¿qué tienen en común el NH₃, el PH₃ y el PCl₃? ¿Y el H₂O, el H₂S y el OF₂?", "a": "<b>Mismo grupo → misma estructura de Lewis y misma geometría.</b><br>P como N → pirámide trigonal. S como O → angular. Si como C → tetraédrica. Al como B → trigonal plana.", "img": null, "ex": 1, "e": 1}, {"id": "c4_14", "b": 4, "q": "¿La forma de una molécula la «causa» la hibridación?", "a": "No. La forma la explica la <b>RPECV</b>; la hibridación la <b>describe</b> con orbitales. Además, la hibridación es del <b>átomo central</b>, no de la molécula.", "img": null, "ex": 1, "e": 0}, {"id": "c5_0", "b": 5, "q": "¿De qué depende que una molécula sea polar?", "a": "De dos cosas: que tenga <b>enlaces polares</b> y de su <b>geometría</b>. Si los dipolos de enlace se anulan (suma vectorial = 0), la molécula es apolar.", "img": "nh3_pol", "ex": 1, "e": 1}, {"id": "c5_1", "b": 5, "q": "¿Por qué el CO₂ es apolar si sus enlaces C=O son polares?", "a": "Porque es <b>lineal</b>: los dos dipolos C=O son iguales y opuestos, y se anulan.", "img": null, "ex": 1, "e": 1}, {"id": "c5_2", "b": 5, "q": "¿Por qué el agua es polar?", "a": "Porque es <b>angular</b>: los dos dipolos O–H no se anulan.", "img": null, "ex": 1, "e": 1}, {"id": "c5_3", "b": 5, "q": "¿Por qué el CH₄ y el CCl₄ son apolares y el CHCl₃ es polar?", "a": "En la geometría tetraédrica los dipolos se anulan solo si los cuatro átomos son <b>iguales</b> (CH₄, CCl₄). En el CHCl₃ hay un H y tres Cl: los dipolos no se anulan → <b>polar</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c5_4", "b": 5, "q": "¿Qué geometrías dan moléculas apolares y cuáles polares?", "a": "<b>Apolares</b> (con átomos iguales): lineal AB₂, trigonal plana AB₃, tetraédrica AB₄ → CO₂, BF₃, CH₄, PCl₅, SF₆.<br><b>Polares</b>: angular, pirámide trigonal o con átomos distintos → H₂O, NH₃, SO₂, CHCl₃.", "img": null, "ex": 1, "e": 1}, {"id": "c6_0", "b": 6, "q": "¿En qué consiste el modelo del gas de electrones (enlace metálico)?", "a": "Los átomos del metal pierden sus electrones de valencia y forman una <b>red de cationes</b>. Los electrones quedan <b>deslocalizados</b> («gas» o «mar» de electrones) y mantienen unida la red.", "img": "metalico", "ex": 1, "e": 1}, {"id": "c6_1", "b": 6, "q": "Propiedades de los metales.", "a": "Brillo · alta <b>conductividad eléctrica y térmica</b> (sólidos y fundidos) · <b>dúctiles</b> (hilos) y <b>maleables</b> (láminas) · puntos de fusión generalmente altos (el Hg es líquido) · alta densidad.", "img": null, "ex": 1, "e": 1}, {"id": "c6_2", "b": 6, "q": "¿Por qué los metales son maleables y los compuestos iónicos frágiles?", "a": "En un metal, al desplazar una capa de cationes el gas de electrones sigue uniéndolos: <b>no aparecen repulsiones</b>. En un cristal iónico se enfrentan iones del mismo signo y se rompe.", "img": null, "ex": 0, "e": 0}, {"id": "c6_3", "b": 6, "q": "¿Qué son las fuerzas de London (dispersión) y en qué moléculas aparecen?", "a": "Atracciones débiles entre <b>dipolos instantáneos</b>. Aparecen en <b>todas las moléculas</b>, polares o apolares, y aumentan con el tamaño: F₂ y Cl₂ gases, Br₂ líquido, I₂ sólido.", "img": null, "ex": 1, "e": 1}, {"id": "c6_4", "b": 6, "q": "¿Entre qué moléculas hay fuerzas dipolo-dipolo? ¿Y dipolo-dipolo inducido?", "a": "<b>Dipolo-dipolo</b>: entre moléculas polares (HCl, H₂S).<br><b>Dipolo-dipolo inducido</b>: entre una polar y una apolar (por ejemplo, un poco de I₂ en agua).", "img": null, "ex": 1, "e": 0}, {"id": "c6_5", "b": 6, "q": "¿Qué se necesita para que haya puentes de hidrógeno?", "a": "Un <b>H unido a F, O o N</b>: átomos pequeños, muy electronegativos y con pares solitarios.<br>Ejemplos: HF, H₂O, NH₃, alcoholes y ácidos carboxílicos.", "img": null, "ex": 1, "e": 1}, {"id": "c6_6", "b": 6, "q": "¿Por qué el agua es líquida a temperatura ambiente y el H₂S es un gas?", "a": "Porque entre las moléculas de agua hay <b>puentes de hidrógeno</b>, mucho más intensos que las fuerzas del H₂S (el S no forma puentes de H).", "img": null, "ex": 1, "e": 1}, {"id": "c6_7", "b": 6, "q": "Ordena por intensidad: enlace covalente, puente de hidrógeno, fuerzas de Van der Waals.", "a": "<b>Van der Waals &lt; puente de hidrógeno &lt; enlace covalente</b>", "img": null, "ex": 1, "e": 1}, {"id": "c6_8", "b": 6, "q": "Cuando hierve el agua, ¿qué se rompe?", "a": "Los <b>puentes de hidrógeno entre moléculas</b>, no los enlaces O–H. El agua sigue siendo H₂O en el vapor.", "img": null, "ex": 1, "e": 1}], "items": [{"id": "BeCl2", "title": "BeCl₂", "sub": "dicloruro de berilio", "info": "Be (Z = 4) · Cl (Z = 17)", "e": 1, "nota": "Hipovalente: el Be se queda con 4 e⁻.", "steps": [{"t": "Estructura de Lewis", "h": "N = 20 · D = 16 · C = 4 → <b>2 pares de enlace</b> · S = 12 → <b>6 pares solitarios</b> en total.<br>Pares no compartidos en el átomo central (Be): <b>ninguno</b>.", "img": "lewis_BeCl2"}, {"t": "Zonas alrededor del átomo central", "h": "<b>2 zonas</b> alrededor del Be: 2 enlaces → tipo <b>AB₂</b>."}, {"t": "Geometría (TRPECV)", "h": "Disposición de los pares: <b>lineal</b>.<br>Geometría molecular: <b>lineal</b>, ángulo <b>180°</b>.", "img": "geo_BeCl2"}, {"t": "Hibridación", "h": "Hibridación del Be: <b>sp</b> (2 zonas)."}, {"t": "Polaridad y fuerzas", "h": "Molécula <b>apolar</b>.<br>Fuerzas entre moléculas: London (dispersión)."}]}, {"id": "CO2", "title": "CO₂", "sub": "dióxido de carbono", "info": "C (Z = 6) · O (Z = 8)", "e": 1, "nota": "Cada doble enlace cuenta como una sola zona.", "steps": [{"t": "Estructura de Lewis", "h": "N = 24 · D = 16 · C = 8 → <b>4 pares de enlace</b> · S = 8 → <b>4 pares solitarios</b> en total.<br>Pares no compartidos en el átomo central (C): <b>ninguno</b>.", "img": "lewis_CO2"}, {"t": "Zonas alrededor del átomo central", "h": "<b>2 zonas</b> alrededor del C: 2 enlaces → tipo <b>AB₂</b>."}, {"t": "Geometría (TRPECV)", "h": "Disposición de los pares: <b>lineal</b>.<br>Geometría molecular: <b>lineal</b>, ángulo <b>180°</b>.", "img": "geo_CO2"}, {"t": "Hibridación", "h": "Hibridación del C: <b>sp</b> (2 zonas)."}, {"t": "Polaridad y fuerzas", "h": "Molécula <b>apolar</b>.<br>Fuerzas entre moléculas: London (dispersión)."}]}, {"id": "CS2", "title": "CS₂", "sub": "disulfuro de carbono", "info": "C (Z = 6) · S (Z = 16)", "e": 0, "nota": "El S está en el grupo del O: igual que el CO₂.", "steps": [{"t": "Estructura de Lewis", "h": "N = 24 · D = 16 · C = 8 → <b>4 pares de enlace</b> · S = 8 → <b>4 pares solitarios</b> en total.<br>Pares no compartidos en el átomo central (C): <b>ninguno</b>.", "img": "lewis_CS2"}, {"t": "Zonas alrededor del átomo central", "h": "<b>2 zonas</b> alrededor del C: 2 enlaces → tipo <b>AB₂</b>."}, {"t": "Geometría (TRPECV)", "h": "Disposición de los pares: <b>lineal</b>.<br>Geometría molecular: <b>lineal</b>, ángulo <b>180°</b>.", "img": "geo_CS2"}, {"t": "Hibridación", "h": "Hibridación del C: <b>sp</b> (2 zonas)."}, {"t": "Polaridad y fuerzas", "h": "Molécula <b>apolar</b>.<br>Fuerzas entre moléculas: London (dispersión)."}]}, {"id": "HCN", "title": "HCN", "sub": "cianuro de hidrógeno", "info": "H (Z = 1) · C (Z = 6) · N (Z = 7)", "e": 0, "nota": "Lineal pero polar: los dos átomos unidos al C son distintos.", "steps": [{"t": "Estructura de Lewis", "h": "N = 18 · D = 10 · C = 8 → <b>4 pares de enlace</b> · S = 2 → <b>1 par solitario</b> en total.<br>Pares no compartidos en el átomo central (C): <b>ninguno</b>.", "img": "lewis_HCN"}, {"t": "Zonas alrededor del átomo central", "h": "<b>2 zonas</b> alrededor del C: 2 enlaces → tipo <b>AB₂</b>."}, {"t": "Geometría (TRPECV)", "h": "Disposición de los pares: <b>lineal</b>.<br>Geometría molecular: <b>lineal</b>, ángulo <b>180°</b>.", "img": "geo_HCN"}, {"t": "Hibridación", "h": "Hibridación del C: <b>sp</b> (2 zonas)."}, {"t": "Polaridad y fuerzas", "h": "Molécula <b>polar</b>.<br>Fuerzas entre moléculas: dipolo-dipolo y London."}]}, {"id": "BF3", "title": "BF₃", "sub": "trifluoruro de boro", "info": "B (Z = 5) · F (Z = 9)", "e": 1, "nota": "Hipovalente: el B se queda con 6 e⁻.", "steps": [{"t": "Estructura de Lewis", "h": "N = 30 · D = 24 · C = 6 → <b>3 pares de enlace</b> · S = 18 → <b>9 pares solitarios</b> en total.<br>Pares no compartidos en el átomo central (B): <b>ninguno</b>.", "img": "lewis_BF3"}, {"t": "Zonas alrededor del átomo central", "h": "<b>3 zonas</b> alrededor del B: 3 enlaces → tipo <b>AB₃</b>."}, {"t": "Geometría (TRPECV)", "h": "Disposición de los pares: <b>trigonal plana</b>.<br>Geometría molecular: <b>trigonal plana</b>, ángulo <b>120°</b>.", "img": "geo_BF3"}, {"t": "Hibridación", "h": "Hibridación del B: <b>sp²</b> (3 zonas)."}, {"t": "Polaridad y fuerzas", "h": "Molécula <b>apolar</b>.<br>Fuerzas entre moléculas: London (dispersión)."}]}, {"id": "AlCl3", "title": "AlCl₃", "sub": "tricloruro de aluminio", "info": "Al (Z = 13) · Cl (Z = 17)", "e": 0, "nota": "El Al está en el grupo del B: hipovalente como el BF₃ (6 e⁻).", "steps": [{"t": "Estructura de Lewis", "h": "N = 30 · D = 24 · C = 6 → <b>3 pares de enlace</b> · S = 18 → <b>9 pares solitarios</b> en total.<br>Pares no compartidos en el átomo central (Al): <b>ninguno</b>.", "img": "lewis_AlCl3"}, {"t": "Zonas alrededor del átomo central", "h": "<b>3 zonas</b> alrededor del Al: 3 enlaces → tipo <b>AB₃</b>."}, {"t": "Geometría (TRPECV)", "h": "Di e rompen los <b>puentes de hidrógeno</b> entre moléculas.", "e": 1}, {"id": "e7", "s": "La energía reticular es positiva porque hay que dar energía para formar el cristal.", "v": 0, "w": "Al formarse el cristal se <b>desprende</b> energía: Er &lt; 0.", "e": 1}, {"id": "e8", "s": "En el ciclo de Born-Haber del NaCl se usa la energía de disociación D completa.", "v": 0, "w": "Solo se necesita un átomo de Cl: <b>½ D</b>.", "e": 1}, {"id": "e9", "s": "En el ciclo del MgO basta con la primera energía de ionización del Mg.", "v": 0, "w": "Para formar Mg²⁺ hay que sumar <b>I₁ + I₂</b>.", "e": 0}, {"id": "e10", "s": "La hibridación es una propiedad de la molécula.", "v": 0, "w": "La hibridación es del <b>átomo central</b>.", "e": 1}, {"id": "e11", "s": "La hibridación es la causa de la forma de la molécula.", "v": 0, "w": "La forma la explica la <b>RPECV</b>; la hibridación la describe con orbitales.", "e": 0}, {"id": "e12", "s": "El BF₃ no puede existir porque el B no completa el octeto.", "v": 0, "w": "Existe: es un caso de <b>hipovalencia</b> (el B queda con 6 e⁻).", "e": 1}, {"id": "e13", "s": "El PH₃ forma puentes de hidrógeno, igual que el NH₃.", "v": 0, "w": "El P no es lo bastante pequeño ni electronegativo: <b>no</b> hay puentes de H.", "e": 1}, {"id": "e14", "s": "Las fuerzas de London solo existen entre moléculas apolares.", "v": 0, "w": "Existen en <b>todas</b> las moléculas.", "e": 1}, {"id": "e15", "s": "Un enlace π es más fuerte que un enlace σ.", "v": 0, "w": "El π (solapamiento lateral) es <b>más débil</b> que el σ (frontal).", "e": 1}, {"id": "e16", "s": "En el NH₄⁺ uno de los enlaces N–H es un enlace covalente coordinado.", "v": 1, "w": "El N aporta su par solitario al H⁺. Una vez formado, los cuatro enlaces son iguales.", "e": 1}, {"id": "e17", "s": "A mayor orden de enlace, menor longitud y mayor energía de enlace.", "v": 1, "w": "C≡C es más corto y más fuerte que C=C, y este que C–C.", "e": 1}, {"id": "e18", "s": "El H puede ser el átomo central de una estructura de Lewis.", "v": 0, "w": "El H solo admite 2 e⁻ (un enlace): <b>nunca</b> es átomo central.", "e": 1}, {"id": "e19", "s": "Si Δχ &gt; 1,7, el enlace siempre es iónico.", "v": 0, "w": "Es una regla <b>orientativa</b>: el BeF₂ y el BF₃ la superan y son covalentes.", "e": 0}, {"id": "e20", "s": "El CHCl₃ es apolar porque su geometría es tetraédrica.", "v": 0, "w": "Tiene átomos distintos (un H y tres Cl): los dipolos no se anulan → <b>polar</b>.", "e": 0}, {"id": "e21", "s": "Los pares solitarios no influyen en la geometría porque «no se ven».", "v": 0, "w": "No se ven, pero <b>repelen más</b> y cierran los ángulos (107° en el NH₃).", "e": 1}, {"id": "e22", "s": "El NH₃ y el PH₃ tienen la misma geometría: pirámide trigonal.", "v": 1, "w": "El P está en el mismo grupo que el N: misma estructura de Lewis y misma forma.", "e": 1}, {"id": "e23", "s": "Una disolución de NaCl en agua conduce la electricidad.", "v": 1, "w": "Los iones Na⁺ y Cl⁻ quedan libres y se mueven.", "e": 1}, {"id": "e24", "s": "La suma de las cargas formales de una especie es igual a su carga total.", "v": 1, "w": "En una molécula neutra suman 0; en el NH₄⁺ suman +1.", "e": 0}, {"id": "e25", "s": "Los metales son frágiles porque al golpearlos se enfrentan cargas iguales.", "v": 0, "w": "Eso les pasa a los <b>iónicos</b>. Los metales son dúctiles y maleables: el gas de electrones evita las repulsiones.", "e": 0}]};
const M2=DATA.meta.modo2; const K=DATA.meta.clave;
const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mode='c', easy=st.get(K+'_easy',false), sessLen=st.get(K+'_len',10), blk=st.get(K+'_blk','all');
let queue=[], cur=null, phase=0, stats={ok:0,ko:0};
const KEY={c:K+'_box_c',m:K+'_box_m',e:K+'_box_e'};
function boxes(m){return st.get(KEY[m],{})}
function setBox(m,id,v){const b=boxes(m);b[id]=v;st.set(KEY[m],b)}
function pool(m){
  let p = m==='c'?DATA.cards:(m==='m'?DATA.items:DATA.errs);
  if(m==='c'&&blk!=='all') p=p.filter(x=>String(x.b)===String(blk));
  if(easy) p=p.filter(x=>x.e);
  return p;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  const b=boxes(mode); const p=shuffle(pool(mode).slice());
  p.sort((x,y)=>(b[x.id]||1)-(b[y.id]||1));
  queue = sessLen? p.slice(0,sessLen):p;
  stats={ok:0,ko:0}; next();
}
function next(){cur=queue.shift()||null; phase=0; render()}
function answer(ok){
  const b=boxes(mode); const v=b[cur.id]||1;
  if(ok){setBox(mode,cur.id,Math.min(5,v+1)); stats.ok++}
  else{setBox(mode,cur.id,1); stats.ko++; queue.splice(Math.min(3,queue.length),0,cur)}
  next();
}
function progress(){
  const p=pool(mode), b=boxes(mode); const cnt=[0,0,0,0,0];
  p.forEach(x=>cnt[(b[x.id]||1)-1]++);
  const cols=['#FDECEA','#FFF3CD','#FFF8E1','#E8F5E9','#C8E6C9'];
  const tc=['#B71C1C','#7a5a00','#8a6d00','#2E7D32','#1B5E20'];
  const mast=cnt[3]+cnt[4];
  $('#prog').innerHTML=`<b>${mast} de ${p.length}</b> tarjetas dominadas · en esta sesión: ✔ ${stats.ok} · ✘ ${stats.ko} · quedan ${queue.length+(cur?1:0)}
   <div class="boxes">${cnt.map((c,i)=>`<div style="background:${cols[i]};color:${tc[i]}" title="Caja ${i+1}">${c}</div>`).join('')}</div>
   <div class="lbl"><span>Caja 1 · por aprender</span><span>Caja 5 · dominadas</span></div>`;
}
function chips(x){
  let h=''; if(mode==='c') h+=`<span class="chip">${DATA.blocks[x.b]}</span>`;
  if(x.ex) h+='<span class="chip ex">★ Pregunta de examen</span>';
  if(mode==='m') h+=`<span class="chip ex">${M2.chip}</span>`;
  return h?`<div class="chips">${h}</div>`:'';
}
function img(n,alt){return n?`<img src="img/${n}.jpg" alt="${alt}" loading="lazy">`:''}
function doneView(){
  return `<div class="card done"><div class="big">🎉</div><p><b>¡Sesión terminada!</b><br>Aciertos: ${stats.ok} · Fallos: ${stats.ko}</p>
  <p class="hint">Las tarjetas que fallas vuelven a salir pronto; las que dominas, más tarde.</p>
  <div class="btns"><button class="btn show" id="again">Otra sesión</button></div></div>`;
}
function render(){
  document.body.classList.toggle('easy',easy);
  $('#bar').style.display = mode==='h'?'none':'flex';
  $('#prog').style.display = mode==='h'?'none':'block';
  $('#blk').style.display = mode==='c'?'':'none';
  const v=$('#view');
  if(mode==='h'){v.innerHTML=HELP();return}
  progress();
  if(!cur){v.innerHTML=doneView(); $('#again').onclick=build; return}
  if(mode==='c'){
    v.innerHTML=`<article class="card">${chips(cur)}<div class="q">${cur.q}</div>
     ${phase? `<div class="a">${cur.a}${img(cur.img,'Ilustración')}</div>
       <div class="btns"><button class="btn no" id="no">✘ No lo sabía</button><button class="btn si" id="si">✔ Lo sabía</button></div>`
     : `<p class="hint">Piensa la respuesta (o dila en voz alta) y después dale la vuelta.</p><div class="btns"><button class="btn show" id="flip">Ver respuesta</button></div>`}
    </article>`;
  } else if(mode==='m'){
    const S=cur.steps.map(x=>[x.t,x.h,x.img||null]); const NS=S.length;
    v.innerHTML=`<article class="card">${chips(cur)}<div class="mf">${cur.title}</div><div class="mn">${cur.sub||''}</div><div class="mz">${cur.info||''}</div>
     <div class="task">${M2.tarea}</div>
     ${S.map((s,i)=>`<div class="step ${i<phase?'':'locked'}"><h3><span class="n">${i+1}</span>${s[0]}</h3>${i<phase?`<div class="c">${s[1]}${s[2]?img(s[2],s[0]+' de '+cur.f):''}</div>`:''}</div>`).join('')}
     ${phase>=NS && cur.nota? `<div class="note">💡 ${cur.nota}</div>`:''}
     <div class="btns">${phase<NS? `<button class="btn show" id="flip">Destapar paso ${phase+1}</button>${phase<NS-1?'<button class="btn ghost" id="all">Ver todo</button>':''}`
       : `<button class="btn no" id="no">✘ Me equivoqué</button><button class="btn si" id="si">✔ Lo hice bien</button>`}</div></article>`;
  } else {
    v.innerHTML=`<article class="card">${chips(cur)}<div class="hint" style="margin-top:0">¿Verdadero o falso?</div><div class="vf">«${cur.s}»</div>
     ${phase? `<div class="fb ${phase===1?'ok':'ko'}"><b class="t">${phase===1?'✔ ¡Correcto!':'✘ No'} · Es ${cur.v?'VERDADERO':'FALSO'}</b>${cur.w}</div>
        <div class="btns"><button class="btn show" id="cont">Siguiente</button></div>`
      : `<div class="btns"><button class="btn si" id="vt">Verdadero</button><button class="btn no" id="vf">Falso</button></div>`}</article>`;
  }
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on('flip',()=>{phase++;render()});
  on('all',()=>{phase=(cur.steps?cur.steps.length:5);render()});
  on('si',()=>answer(true)); on('no',()=>answer(false));
  on('vt',()=>{phase=(cur.v?1:2);render()}); on('vf',()=>{phase=(cur.v?2:1);render()});
  on('cont',()=>answer(phase===1));
}
const HELP=()=>`<div class="card help">
<h2>¿Cómo funcionan?</h2>
<p>Cada tarjeta tiene una <b>pregunta</b>. Intenta responderla de memoria <b>antes</b> de darle la vuelta. Después sé sincero:</p>
<ul><li><b>✔ Lo sabía</b>: la tarjeta sube de caja y tardará más en volver.</li><li><b>✘ No lo sabía</b>: vuelve a la caja 1 y te saldrá otra vez enseguida.</li></ul>
<p>Las cajas van de la 1 (por aprender) a la 5 (dominadas). Cada sesión empieza por las que peor llevas. Tu progreso se guarda en este dispositivo.</p>
<h2>Los tres modos</h2>
<ul><li><b>Conceptos</b>: la teoría del tema en preguntas cortas. Las marcadas con <b>★ Pregunta de examen</b> son las que suelen caer.</li>
<li><b>${M2.titulo}</b>: ${M2.ayuda}</li>
<li><b>Errores típicos</b>: frases de verdadero o falso con los fallos que más restan puntos.</li></ul>
<h2>Consejos</h2>
<ul><li>Mejor <b>10 minutos cada día</b> que una hora el día antes del examen.</li><li>Di la respuesta en voz alta o escríbela: así se recuerda mejor.</li>
<li><b>Lectura fácil</b> pone letra más grande y espaciada y deja solo las tarjetas esenciales.</li></ul>
<div class="btns"><button class="btn ghost" id="reset">Borrar mi progreso</button></div></div>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  mode=b.dataset.m; if(mode==='h'){render(); const r=document.getElementById('reset'); if(r) r.onclick=()=>{if(confirmReset()){Object.values(KEY).forEach(k=>st.set(k,{})); r.textContent='Progreso borrado'}}; return} build();
});
function confirmReset(){const r=document.getElementById('reset'); if(r.dataset.c){return true} r.dataset.c=1; r.textContent='Pulsa otra vez para confirmar'; return false}
const sel=$('#blk'); sel.innerHTML='<option value="all">Todos los bloques</option>'+DATA.blocks.map((b,i)=>`<option value="${i}">${i+1}. ${b}</option>`).join('');
sel.value=blk; sel.onchange=()=>{blk=sel.value; st.set(K+'_blk',blk); build()};
$('#len').value=String(sessLen); $('#len').onchange=e=>{sessLen=+e.target.value; st.set(K+'_len',sessLen); build()};
$('#easy').checked=easy; $('#easy').onchange=e=>{easy=e.target.checked; st.set(K+'_easy',easy); build()};
build();
</script>
</body>
</html>
